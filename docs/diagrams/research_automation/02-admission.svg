" width="260.0" height="80.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="1710.0" y="155.0" width="260.0" height="80.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="165.0" y="247.35" width="290.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="485.0" y="317.35" width="300.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="815.0" y="387.35" width="310.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="485.0" y="452.35" width="300.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="60.0" y="555.0" width="550.0" height="85.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2" x="815.0" y="627.0" width="310.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="165.0" y="697.0" width="620.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="815.0" y="767.0" width="660.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1505.0" y="812.35" width="320.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1505.0" y="902.0" width="320.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="815.0" y="967.0" width="660.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="815.0" y="1007.35" width="310.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="815.0" y="1097.0" width="660.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="70.0" y="1190.0" width="1840.0" height="95.0" rx="12" fill="#F0F4F8" stroke="#718298" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">02  イベント受付・承認・開始のシーケンス</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">receiptは通知、ownerコメントは承認、claimは実行消費。3つを別々に扱う。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">02 / 07   |   仕様基準: docs/research_automation_spec.md @ ed3ce770   |   実装: PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: actions_inbox.py / direct_pr_service.py / execution_delivery.py / resident launcher</text><text x="150.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">GitHub</text><text x="150.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">Issue / 承認</text><text x="470.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">runner / UID10003</text><text x="470.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">固定submit client</text><text x="800.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">manager / UID10001</text><text x="800.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">承認・直列dispatch</text><text x="1140.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">永続状態</text><text x="1140.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">inbox / 実行台帳</text><text x="1490.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">root broker</text><text x="1490.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">ローカルDocker</text><text x="1840.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">実験supervisor</text><text x="1840.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">root・モデル未起動</text><rect x="165.0" y="247.35" width="290.0" height="49.65" fill="#FFFFFF" /><text x="310.0" y="251.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">1  Issue / commentイベント →</text><text x="310.0" y="276.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">Actions job</text><rect x="485.0" y="317.35" width="300.0" height="49.65" fill="#FFFFFF" /><text x="635.0" y="321.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">2  receipt（Unix socket / peer</text><text x="635.0" y="346.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">UID照合）</text><rect x="815.0" y="387.35" width="310.0" height="49.65" fill="#FFFFFF" /><text x="970.0" y="391.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">3  receiptを永続化 / FULL</text><text x="970.0" y="416.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">commit</text><rect x="485.0" y="452.35" width="300.0" height="49.65" fill="#FFFFFF" /><text x="635.0" y="456.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">4  commit後ACK → Actionsは</text><text x="635.0" y="481.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">配送成功</text><text x="72.0" y="575.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">OFFでも受付設定がONならreceiptを保存。</text><text x="72.0" y="601.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">OFFの間は取出し・新規実行を始めない。</text><rect x="815.0" y="627.0" width="310.0" height="25.0" fill="#FFFFFF" /><text x="970.0" y="631.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">5  ON時にPENDING → ACTIVE</text><rect x="165.0" y="697.0" width="620.0" height="25.0" fill="#FFFFFF" /><text x="475.0" y="701.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">6  現行Issue・未編集owner承認を再取得 / 内容hash・期限・取消を照合</text><rect x="815.0" y="767.0" width="660.0" height="25.0" fill="#FFFFFF" /><text x="1145.0" y="771.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">7  モデル・scope・予算を解決 → preflight要求</text><rect x="1505.0" y="812.35" width="320.0" height="49.65" fill="#FFFFFF" /><text x="1665.0" y="816.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">8  acquire / 公開bootstrap /</text><text x="1665.0" y="841.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">prepare</text><rect x="1505.0" y="902.0" width="320.0" height="25.0" fill="#FFFFFF" /><text x="1665.0" y="906.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">9  ready（epoch + policy hash）</text><rect x="815.0" y="967.0" width="660.0" height="25.0" fill="#FFFFFF" /><text x="1145.0" y="971.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">10  実行前チェック通過（開始境界）。この後のOFFだけでは取り消さない</text><rect x="815.0" y="1007.35" width="310.0" height="49.65" fill="#FFFFFF" /><text x="970.0" y="1011.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">11  owner記録確認 + 単回claimを</text><text x="970.0" y="1036.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">保存</text><rect x="815.0" y="1097.0" width="660.0" height="25.0" fill="#FFFFFF" /><text x="1145.0" y="1101.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">12  bindingを送る。brokerがjob認証を読み、executeへ</text><text x="82.0" y="1214.225" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">prepareまで：モデル認証は実験側へ渡さず、model turnも開始しない。</text><text x="82.0" y="1241.7749999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同一Issueの既存claim、未登録先、scope/予算/承認不一致は、新しい研究実行に進まない。</text></svg>