<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img"><title>05  権限・認証・永続性の境界</title><desc>仕様と実装を照合した編集可能draw.io図のプレビュー。基準: PR108 / 仕様書PR115。</desc><rect x="0" y="0" width="2000" height="1400" fill="#FFFFFF" /><rect stroke-width="2" x="55.0" y="175.0" width="880.0" height="765.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="1040.0" y="175.0" width="900.0" height="765.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><polyline points="492.5,440.0 702.5,520.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="702.5,520.0 693.0661238188123,511.0556173942513 689.5061705428924,520.400494743541" fill="#2864A5" /><polyline points="492.5,440.0 275.0,520.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" /><polygon points="275.0,520.0 287.9883529273496,520.5501710957599 284.5362989931703,511.1648994622099" fill="#2864A5" /><polyline points="890.0,602.5 985.0,602.0 985.0,363.0 1080.0,362.5" fill="none" stroke="#9D640D" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1080.0,362.5 1067.9738507765364,357.56322627063076 1068.0264816265299,367.5630877693531" fill="#9D640D" /><polyline points="1460.0,362.5 1515.0,362.5" fill="none" stroke="#9D640D" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1515.0,362.5 1503.0,357.5 1503.0,367.5" fill="#9D640D" /><polyline points="1707.5,440.0 1585.0,550.0" fill="none" stroke="#9D640D" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1585.0,550.0 1597.2692114064375,545.7027390742305 1590.5879576702587,538.2622519589404" fill="#9D640D" /><polyline points="1270.0,440.0 1150.0,622.0 1270.0,622.5" fill="none" stroke="#087E8B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1270.0,622.5 1258.020937317801,617.4500438362348 1257.9792710128197,627.4499570318095" fill="#087E8B" /><polyline points="1585.0,695.0 1585.0,770.0" fill="none" stroke="#087E8B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1585.0,770.0 1590.0,758.0 1580.0,758.0" fill="#087E8B" /><polyline points="702.5,685.0 702.5,760.0" fill="none" stroke="#9D640D" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" /><polygon points="702.5,760.0 707.5,748.0 697.5,748.0" fill="#9D640D" /><rect stroke-width="2" x="95.0" y="285.0" width="795.0" height="155.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="95.0" y="520.0" width="360.0" height="165.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="515.0" y="520.0" width="375.0" height="165.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="95.0" y="760.0" width="360.0" height="135.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2" x="515.0" y="760.0" width="375.0" height="135.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2" x="1080.0" y="285.0" width="380.0" height="155.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1515.0" y="285.0" width="385.0" height="155.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2" x="1270.0" y="550.0" width="630.0" height="145.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1270.0" y="770.0" width="630.0" height="125.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2" x="885.0" y="454.4" width="200.0" height="51.2" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1387.5" y="236.0" width="205.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="70.0" y="995.0" width="1845.0" height="95.0" rx="12" fill="#FCEDEF" stroke="#AD3E45" /><rect stroke-width="2" x="70.0" y="1130.0" width="1845.0" height="120.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><text x="67.0" y="189.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">管理側の信頼領域</text><text x="1052.0" y="189.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">実験側の信頼領域</text><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">05  権限・認証・永続性の境界</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">管理側の認証とDocker権限をCodexへ渡さない。worker用認証はjob限定で明示して渡す。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">05 / 07   |   仕様基準: docs/research_automation_spec.md @ ed3ce770   |   実装: PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: execution_docker.validate_docker_authority / execution_worker.stage_credentials, return_auth_state / worker_pr</text><text x="492.5" y="323.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">/control（manager所有 / 私有volume）</text><text x="492.5" y="352.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">モデル認証原本 / manager GitHub / PR用認証原本</text><text x="492.5" y="381.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">設定・owner記録・claim・結果</text><text x="275.0" y="554.35" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">manager / UID10001</text><text x="275.0" y="580.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">GitHubから現行Issueとownerコメント</text><text x="275.0" y="606.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">を読む</text><text x="275.0" y="632.65" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">worker成果物をrootとして実行しない</text><text x="702.5" y="554.35" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">job broker / root</text><text x="702.5" y="580.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">PID1経由でjobごとに起動</text><text x="702.5" y="606.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">固定Dockerバイナリ + root専用socket</text><text x="702.5" y="632.65" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">必要なjob認証だけを私有pipeへ</text><text x="275.0" y="792.4" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">runner / UID10003</text><text x="275.0" y="818.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">/runnerの専用volume</text><text x="275.0" y="844.6" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">管理台帳・認証にはアクセスさせない</text><text x="702.5" y="792.4" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">host /var/run/docker.sock</text><text x="702.5" y="818.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">→ /run/c3-docker.sock</text><text x="702.5" y="844.6" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">root以外の権限を配置時に検査</text><text x="1270.0" y="327.4" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">root supervisor</text><text x="1270.0" y="353.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">UID切替 / lease / 子孫回収</text><text x="1270.0" y="379.59999999999997" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">job用homeを新規作成・所有権設定</text><text x="1707.5" y="327.4" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">私有job用home</text><text x="1707.5" y="353.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">/work/codex-home/auth.json</text><text x="1707.5" y="379.59999999999997" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">/work/worker-home/github-token</text><text x="1585.0" y="583.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">Codex / 研究UID10002</text><text x="1585.0" y="612.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">空の追加group / no-new-privileges</text><text x="1585.0" y="641.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">通常shell・file toolsとjob用認証を利用</text><text x="1585.0" y="795.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">研究workspace</text><text x="1585.0" y="823.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">同じUIDで読める既存データは残る</text><text x="1585.0" y="850.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">write_scopeはOSの全書込隔離ではない</text><rect x="885.0" y="454.4" width="200.0" height="51.2" fill="#FFFFFF" /><text x="985.0" y="460.4" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">モデル + PR用認証</text><text x="985.0" y="483.59999999999997" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">私有pipeで転送</text><rect x="1387.5" y="236.0" width="205.0" height="28.0" fill="#FFFFFF" /><text x="1490.0" y="242.0" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">0600 / UID10002</text><text x="82.0" y="1018.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">渡さない：管理用GitHub認証、/control、/runner、Docker socket、ホストのSSH鍵。</text><text x="82.0" y="1047.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">ただし、PR用credentialにowner権限を使う現在の設定では、承認コメント作成能力等の残余リスクがある。</text><text x="82.0" y="1164.275" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">認証refresh：同じ記録上のaccount identityだけを私有channelで返す。管理原本の競合も検査し、保存ACK後に回収。</text><text x="82.0" y="1194.7250000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">正常回収：子孫停止・ECHILD → refresh保存確認 → job用home削除。失敗なら私有状態を保持してblock。</text></svg>