8" stroke="none" /><rect stroke-width="1.4166666666666667" transform="rotate(-26.56505117707799 1753.5 193.58333333333334)" x="1743.9967110956259" y="192.52083333333334" width="19.006577808748215" height="2.125" rx="0" fill="#718298" stroke="none" /><rect stroke-width="1.4166666666666667" transform="rotate(-90.0 1762.0 186.85416666666666)" x="1759.5208333333333" y="185.79166666666666" width="4.958333333333334" height="2.125" rx="0" fill="#718298" stroke="none" /><ellipse stroke-width="1.4166666666666667" cx="1745.0" cy="183.66666666666666" rx="4.25" ry="4.25" fill="#FFFFFF" stroke="#718298" /><ellipse stroke-width="1.4166666666666667" cx="1745.0" cy="206.33333333333334" rx="4.25" ry="4.25" fill="#FFFFFF" stroke="#718298" /><ellipse stroke-width="1.4166666666666667" cx="1762.0" cy="183.66666666666666" rx="4.25" ry="4.25" fill="#FFFFFF" stroke="#718298" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">03  実験・認証・終了のシーケンス</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Codexは実験側の同じセッションで研究を完了する。結果は回収の確認後に返す。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">03 / 07   |   仕様基準: docs/research_automation_spec.md @ ed3ce770   |   実装: PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: execution_delivery.ContainerSession.run / execution_worker.run_job / goal_runner / worker_pr</text><text x="685.0" y="271.0" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">1  execute：binding + job用認証</text><text x="722.0" y="365.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">2  GPU空き待機・lock・再観測</text><text x="722.0" y="391.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">モデル認証homeを準備 → 版照合済みCodex起動</text><text x="1035.0" y="461.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">3  Codexセッションを1回起動</text><text x="1052.0" y="545.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">4  コード調査・編集 → 実験 → 完了待ち → 解析</text><text x="1052.0" y="571.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同一セッション。実験後に解析用Codexを呼び直さない。</text><text x="1380.0" y="646.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">5  manifest・planを渡してpublish</text><text x="1700.0" y="691.35" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">6  intent → branch / PR →</text><text x="1700.0" y="716.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">readback</text><text x="1035.0" y="761.35" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">7  最終JSON：outcome /</text><text x="1035.0" y="786.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">summary / pr_url</text><text x="702.0" y="875.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">8  transportを閉じる → 子孫を停止・reap → ECHILD</text><text x="702.0" y="901.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">必要な認証refreshを管理側へ返して保存ACKを確認 → 一時home削除</text><text x="685.0" y="956.35" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">9  worker_result / failure +</text><text x="685.0" y="981.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">cleanup_verified</text><text x="340.0" y="1021.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">10  私有結果保存・構造化結果 / 失</text><text x="340.0" y="1046.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">敗を返す</text><text x="340.0" y="1086.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">11  job_finished → 管理側回収</text><text x="340.0" y="1111.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">ACK → receipt FINISHED</text><text x="77.0" y="1222.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">実行中の並行監督：managerが承認再確認 → brokerは約2秒ごとにlease。実験側のlease窓は10秒。</text><text x="77.0" y="1249.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">OFFは次の仕事を止める。取消・期限・lease途絶・資源違反は現在の自jobを止める。回収不明なら次を始めない。</text><text x="102.5" y="168.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">実行判断</text><text x="102.5" y="205.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">manager / 台帳</text><text x="442.5" y="168.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナ操作</text><text x="442.5" y="205.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">root broker / 私有pipe</text><text x="792.5" y="168.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">実験の監督</text><text x="792.5" y="205.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">root / GPU・lease・回収</text><text x="1142.5" y="168.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">研究するAI</text><text x="1142.5" y="205.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Codex / UID10002</text><text x="1482.5" y="168.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">結果PRの公開</text><text x="1482.5" y="205.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">公開helper / 任意利用</text><text x="1782.5" y="168.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">結果を受け取る</text><text x="1782.5" y="205.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">GitHub / 結果PR</text></svg>