-dasharray="8 6" /><polygon points="860.0,815.0 872.0,820.0 872.0,810.0" fill="#087E8B" /><polyline points="860.0,1010.0 510.0,1010.0" fill="none" stroke="#087E8B" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" /><polygon points="510.0,1010.0 522.0,1015.0 522.0,1005.0" fill="#087E8B" /><polyline points="510.0,1075.0 170.0,1075.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" /><polygon points="170.0,1075.0 182.0,1080.0 182.0,1070.0" fill="#2864A5" /><polyline points="170.0,1140.0 510.0,1140.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="510.0,1140.0 498.0,1135.0 498.0,1145.0" fill="#2864A5" /><rect stroke-width="2" x="42.5" y="155.0" width="255.0" height="80.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="382.5" y="155.0" width="255.0" height="80.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="732.5" y="155.0" width="255.0" height="80.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1082.5" y="155.0" width="255.0" height="80.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1422.5" y="155.0" width="255.0" height="80.0" rx="12" fill="#ECF7EE" stroke="#32754B" /><rect stroke-width="2" x="1722.5" y="155.0" width="255.0" height="80.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2" x="525.0" y="267.0" width="320.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="710.0" y="345.0" width="630.0" height="85.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="875.0" y="457.0" width="320.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1040.0" y="525.0" width="850.0" height="85.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1225.0" y="642.0" width="310.0" height="25.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1565.0" y="687.35" width="270.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="875.0" y="757.35" width="320.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="690.0" y="850.0" width="960.0" height="95.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2" x="525.0" y="952.35" width="320.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="185.0" y="1017.35" width="310.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="185.0" y="1082.35" width="310.0" height="49.65" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="65.0" y="1200.0" width="1850.0" height="90.0" rx="12" fill="#F0F4F8" stroke="#718298" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">03  実験・認証・終了のシーケンス</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Codexは実験側の同じセッションで研究を完了する。結果は回収の確認後に返す。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">03 / 07   |   仕様基準: docs/research_automation_spec.md @ ed3ce770   |   実装: PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: execution_delivery.ContainerSession.run / execution_worker.run_job / goal_runner / worker_pr</text><text x="170.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">manager</text><text x="170.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">承認再確認・台帳</text><text x="510.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">root broker</text><text x="510.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">私有pipe</text><text x="860.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">実験supervisor</text><text x="860.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">GPU / lease / 回収</text><text x="1210.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">Codex / UID10002</text><text x="1210.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">通常shell・file tools</text><text x="1550.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">公開helper</text><text x="1550.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">workerが任意で利用</text><text x="1850.0" y="172.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">GitHub</text><text x="1850.0" y="199.04999999999998" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">結果PR</text><rect x="525.0" y="267.0" width="320.0" height="25.0" fill="#FFFFFF" /><text x="685.0" y="271.0" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">1  execute：binding + job用認証</text><text x="722.0" y="365.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">2  GPU空き待機・lock・再観測</text><text x="722.0" y="391.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">モデル認証homeを準備 → 版照合済みCodex起動</text><rect x="875.0" y="457.0" width="320.0" height="25.0" fill="#FFFFFF" /><text x="1035.0" y="461.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">3  Codexセッションを1回起動</text><text x="1052.0" y="545.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">4  コード調査・編集 → 実験 → 完了待ち → 解析</text><text x="1052.0" y="571.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同一セッション。実験後に解析用Codexを呼び直さない。</text><rect x="1225.0" y="642.0" width="310.0" height="25.0" fill="#FFFFFF" /><text x="1380.0" y="646.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">5  manifest・planを渡してpublish</text><rect x="1565.0" y="687.35" width="270.0" height="49.65" fill="#FFFFFF" /><text x="1700.0" y="691.35" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">6  intent → branch / PR →</text><text x="1700.0" y="716.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">readback</text><rect x="875.0" y="757.35" width="320.0" height="49.65" fill="#FFFFFF" /><text x="1035.0" y="761.35" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">7  最終JSON：outcome /</text><text x="1035.0" y="786.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">summary / pr_url</text><text x="702.0" y="875.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">8  transportを閉じる → 子孫を停止・reap → ECHILD</text><text x="702.0" y="901.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">必要な認証refreshを管理側へ返して保存ACKを確認 → 一時home削除</text><rect x="525.0" y="952.35" width="320.0" height="49.65" fill="#FFFFFF" /><text x="685.0" y="956.35" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">9  worker_result / failure +</text><text x="685.0" y="981.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">cleanup_verified</text><rect x="185.0" y="1017.35" width="310.0" height="49.65" fill="#FFFFFF" /><text x="340.0" y="1021.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">10  私有結果保存・構造化結果 / 失</text><text x="340.0" y="1046.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">敗を返す</text><rect x="185.0" y="1082.35" width="310.0" height="49.65" fill="#FFFFFF" /><text x="340.0" y="1086.35" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">11  job_finished → 管理側回収</text><text x="340.0" y="1111.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">ACK → receipt FINISHED</text><text x="77.0" y="1222.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">実行中の並行監督：managerが承認再確認 → brokerは約2秒ごとにlease。実験側のlease窓は10秒。</text><text x="77.0" y="1249.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">OFFは次の仕事を止める。取消・期限・lease途絶・資源違反は現在の自jobを止める。回収不明なら次を始めない。</text></svg>