<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img"><title>04  状態遷移とON/OFF</title><desc>仕様と実装を照合した編集可能draw.io図のプレビュー。基準: PR108 / 仕様書PR115。</desc><rect x="0" y="0" width="2000" height="1400" fill="#FFFFFF" /><rect stroke-width="2" x="55.0" y="165.0" width="900.0" height="440.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="1010.0" y="165.0" width="930.0" height="440.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="55.0" y="660.0" width="1885.0" height="300.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><polyline points="330.0,332.5 380.0,332.5" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="380.0,332.5 368.0,327.5 368.0,337.5" fill="#2864A5" /><polyline points="610.0,332.5 665.0,332.5" fill="none" stroke="#32754B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="665.0,332.5 653.0,327.5 653.0,337.5" fill="#32754B" /><polyline points="495.0,380.0 495.0,445.0 210.0,445.0 210.0,380.0" fill="none" stroke="#9D640D" stroke-width="2.3" stroke-linejoin="round" /><polygon points="210.0,380.0 205.0,392.0 215.0,392.0" fill="#9D640D" /><polyline points="1285.0,332.5 1345.0,332.5" fill="none" stroke="#087E8B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1345.0,332.5 1333.0,327.5 1333.0,337.5" fill="#087E8B" /><polyline points="1580.0,332.5 1640.0,332.5" fill="none" stroke="#32754B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1640.0,332.5 1628.0,327.5 1628.0,337.5" fill="#32754B" /><polyline points="1462.5,380.0 1462.5,460.0" fill="none" stroke="#AD3E45" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1462.5,460.0 1467.5,448.0 1457.5,448.0" fill="#AD3E45" /><polyline points="560.0,817.5 750.0,817.5" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="750.0,817.5 738.0,812.5 738.0,822.5" fill="#2864A5" /><polyline points="1180.0,817.5 1370.0,817.5" fill="none" stroke="#087E8B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1370.0,817.5 1358.0,812.5 1358.0,822.5" fill="#087E8B" /><rect stroke-width="2" x="90.0" y="285.0" width="240.0" height="95.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="380.0" y="285.0" width="230.0" height="95.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="665.0" y="285.0" width="250.0" height="95.0" rx="12" fill="#ECF7EE" stroke="#32754B" /><rect stroke-width="2" x="265.0" y="249.0" width="180.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="545.0" y="249.0" width="190.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="70.0" y="463.0" width="560.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="90.0" y="530.0" width="825.0" height="60.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2" x="1050.0" y="285.0" width="235.0" height="95.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1345.0" y="285.0" width="235.0" height="95.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="1640.0" y="285.0" width="260.0" height="95.0" rx="12" fill="#ECF7EE" stroke="#32754B" /><rect stroke-width="2" x="1345.0" y="460.0" width="235.0" height="90.0" rx="12" fill="#FCEDEF" stroke="#AD3E45" /><rect stroke-width="2" x="1235.0" y="249.0" width="160.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1535.0" y="249.0" width="150.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1382.0" y="406.0" width="160.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1615.0" y="445.0" width="290.0" height="115.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2" x="100.0" y="770.0" width="460.0" height="95.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2" x="750.0" y="760.0" width="430.0" height="115.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2" x="1370.0" y="770.0" width="500.0" height="95.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2" x="565.0" y="791.0" width="170.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1135.0" y="791.0" width="280.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="70.0" y="1030.0" width="1020.0" height="200.0" rx="12" fill="#FCEDEF" stroke="#AD3E45" /><rect stroke-width="2" x="1150.0" y="1030.0" width="750.0" height="200.0" rx="12" fill="#F0F4F8" stroke="#718298" /><text x="67.0" y="179.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">A  配送台帳 / inbox.sqlite</text><text x="1022.0" y="179.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">B  研究実行台帳 / state.sqlite + claims</text><text x="67.0" y="674.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">C  OFFと開始が重なる場合の境界</text><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">04  状態遷移とON/OFF</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">配送状態、研究実行状態、開始境界、回収のgateは別の状態機械。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">04 / 07   |   仕様基準: docs/research_automation_spec.md @ ed3ce770   |   実装: PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: actions_inbox.Inbox / direct_pr_service.DirectPRController / resident launcher / execution_worker</text><text x="210.0" y="310.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">PENDING</text><text x="210.0" y="336.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">commit済みの通知</text><text x="495.0" y="310.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">ACTIVE</text><text x="495.0" y="336.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">直列に処理中</text><text x="790.0" y="310.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">FINISHED</text><text x="790.0" y="336.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">job回収ACK後</text><rect x="265.0" y="249.0" width="180.0" height="28.0" fill="#FFFFFF" /><text x="355.0" y="255.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">ON + 受付有効</text><rect x="545.0" y="249.0" width="190.0" height="28.0" fill="#FFFFFF" /><text x="640.0" y="255.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">処理・回収確認</text><rect x="70.0" y="463.0" width="560.0" height="28.0" fill="#FFFFFF" /><text x="350.0" y="469.0" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">開始前OFF / 確認済み起動時のdelivery lease回復</text><text x="102.0" y="539.175" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じreceipt ID + 同じ内容 → duplicate ACK。</text><text x="102.0" y="563.8249999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じIDの異なるpayload → 拒否。run_attemptだけでは新しい配送にしない。</text><text x="1167.5" y="310.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">未claim</text><text x="1167.5" y="336.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">承認・準備の検査</text><text x="1462.5" y="310.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">CLAIMED</text><text x="1462.5" y="336.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">一度だけ実行を消費</text><text x="1770.0" y="311.675" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">WORKER_FINISHED</text><text x="1770.0" y="336.325" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">completed / incomplete</text><text x="1462.5" y="482.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">BLOCKED</text><text x="1462.5" y="509.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">失敗記録を保持</text><rect x="1235.0" y="249.0" width="160.0" height="28.0" fill="#FFFFFF" /><text x="1315.0" y="255.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">durable claim</text><rect x="1535.0" y="249.0" width="150.0" height="28.0" fill="#FFFFFF" /><text x="1610.0" y="255.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">結果を保存</text><rect x="1382.0" y="406.0" width="160.0" height="28.0" fill="#FFFFFF" /><text x="1462.0" y="412.0" fill="#AD3E45" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">実行失敗</text><text x="1627.0" y="469.35" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">既存claimは再実行しない</text><text x="1627.0" y="494.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">PR欠損・通知重複でも</text><text x="1627.0" y="518.65" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">claimを消さない</text><text x="330.0" y="795.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">開始境界の前</text><text x="330.0" y="821.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">設定・承認・実配置を検査</text><text x="965.0" y="790.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">実行前チェック通過</text><text x="965.0" y="822.4499999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">（preflight成功）</text><text x="1620.0" y="795.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">開始済みの同じjob</text><text x="1620.0" y="821.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">claim → worker → 結果 → 回収</text><rect x="565.0" y="791.0" width="170.0" height="28.0" fill="#FFFFFF" /><text x="650.0" y="797.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">ONで通過</text><rect x="1135.0" y="791.0" width="280.0" height="28.0" fill="#FFFFFF" /><text x="1275.0" y="797.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">以後のOFFだけでは取り消さない</text><text x="100.0" y="906.0" fill="#9D640D" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">OFFなら一時領域を回収し、通知をPENDINGへ。claimなし。</text><text x="1210.0" y="906.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">取消・期限・設定不一致・資源監視は続く。OFF ≠ cancel。</text><text x="580.0" y="1087.1" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">D  回収・起動時の停止gate</text><text x="580.0" y="1119.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">起動時の未確定CLAIMED / cleanup不明 / latchあり</text><text x="580.0" y="1150.8999999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">→ 新規dispatchを止める。自動reset・研究retryをしない。</text><text x="1162.0" y="1089.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">配送のACTIVE → PENDINGは、研究claimの解除ではない。</text><text x="1162.0" y="1119.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">WORKER_FINISHEDは科学的成功の証明ではない。</text><text x="1162.0" y="1149.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">管理側終了だけでは実験側の回収済みを証明しない。</text></svg>