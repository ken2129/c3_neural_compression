ge" text-anchor="start">06 / 07   |   仕様基準: docs/research_automation_spec.md @ ed3ce770   |   実装: PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: goal_plan / direct_pr_service / worker_pr.prepare_publication, publish, _reconcile / Issue116</text><text x="340.0" y="214.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">ownerが承認したIssue</text><text x="340.0" y="244.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">number / author / title / body</text><text x="340.0" y="274.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">→ content SHA256</text><text x="1000.0" y="214.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">共通設定から解決済みplan</text><text x="1000.0" y="244.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">model / execution alias / scope / budget</text><text x="1000.0" y="274.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">→ plan digest</text><text x="1660.0" y="214.05" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">run binding</text><text x="1660.0" y="244.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">Issue hash + plan digest + source SHA</text><text x="1660.0" y="274.95" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">request_id / run_id / issue_number</text><text x="272.5" y="521.675" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">manifest</text><text x="272.5" y="549.2249999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">files + 公開description</text><text x="272.5" y="576.775" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">scope内の通常ファイルだけ</text><text x="272.5" y="604.3249999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">最大32件 / 合計1MiB</text><text x="745.0" y="537.4" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">publication digest</text><text x="745.0" y="563.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">plan + description + path/mode/blob</text><text x="745.0" y="589.6" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">決定的なresearch branch名</text><text x="1222.5" y="537.4" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">durable intentを先に保存</text><text x="1222.5" y="563.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">排他的作成 + fsync</text><text x="1222.5" y="589.6" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">不明なmutationを繰り返さない</text><text x="1697.5" y="535.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">GitHubへ公開</text><text x="1697.5" y="563.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">blob → tree → commit</text><text x="1697.5" y="590.5500000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">→ branch → 通常PR</text><text x="992.5" y="746.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">既存PRを読み取り照合</text><text x="992.5" y="775.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">actor / title・body / head・base / 親commit / 差分 / 完全tree / blob SHA・mode / draft=false</text><text x="992.5" y="804.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">commit末尾LF1文字の省略だけ許容。その他の変更は拒否。再呼出しは読取だけ。</text><text x="635.0" y="1029.6" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">Codexの最終申告 → 管理側が構造とbindingを検査・保存</text><text x="635.0" y="1061.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">outcome: completed / incomplete、summary、pr_url、elapsed</text><text x="635.0" y="1093.3999999999999" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">WORKER_FINISHEDでも pr_verified=false / research_success_verified=false</text><text x="1605.0" y="1016.325" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">Issue116 / 追加案・未実装</text><text x="1605.0" y="1046.775" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">管理側の既存照合への接続・記録</text><text x="1605.0" y="1077.2250000000001" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">実験ごとの検証と共通レポート</text><text x="1605.0" y="1107.675" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">現行の成功条件には描き込まない</text><text x="87.0" y="1230.45" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">別々の事実：モデル完了 ≠ PR実在 ≠ 科学的正しさ ≠ 回収確認 ≠ merge。</text><text x="87.0" y="1256.55" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">公開helperの照合は既存。Issue116はそれを管理側の完了フローへ接続し、足りない検証と記録を補う提案。</text></svg>