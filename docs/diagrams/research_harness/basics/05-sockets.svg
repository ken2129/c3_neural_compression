<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img"><title>基礎05  Dockerコマンドは、Engineへの依頼役</title><desc>仕様と実装を照合した編集可能draw.io図のプレビュー。基準: PR108 / 仕様書PR115。</desc><rect x="0" y="0" width="2000" height="1400" fill="#FFFFFF" /><rect stroke-width="2" x="65.0" y="165.0" width="1870.0" height="965.0" rx="12" fill="#F0F4F8" stroke="#718298" /><polyline points="585.0,417.5 775.0,417.5" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="775.0,417.5 763.0,412.5 763.0,422.5" fill="#2864A5" /><polyline points="1225.0,417.5 1415.0,417.5" fill="none" stroke="#9D640D" stroke-width="2.3" stroke-linejoin="round" /><polygon points="1415.0,417.5 1403.0,412.5 1403.0,422.5" fill="#9D640D" /><polyline points="1650.0,525.0 1650.0,650.0 350.0,650.0 350.0,525.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" /><polygon points="350.0,525.0 345.0,537.0 355.0,537.0" fill="#2864A5" /><rect stroke-width="1.6666666666666667" x="84.0" y="181.33333333333334" width="30.0" height="33.333333333333336" rx="5.3999999999999995" fill="none" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="87.33333333333333" y="185.5" width="23.333333333333336" height="5.833333333333334" rx="1.05" fill="none" stroke="#718298" /><ellipse stroke-width="1.6666666666666667" cx="91.08333333333333" cy="188.41666666666666" rx="1.25" ry="1.25" fill="#718298" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="98.16666666666667" y="187.41666666666666" width="8.333333333333334" height="2.0" rx="0" fill="#718298" stroke="none" /><rect stroke-width="1.6666666666666667" x="87.33333333333333" y="195.5" width="23.333333333333336" height="5.833333333333334" rx="1.05" fill="none" stroke="#718298" /><ellipse stroke-width="1.6666666666666667" cx="91.08333333333333" cy="198.41666666666666" rx="1.25" ry="1.25" fill="#718298" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="98.16666666666667" y="197.41666666666666" width="8.333333333333334" height="2.0" rx="0" fill="#718298" stroke="none" /><rect stroke-width="1.6666666666666667" x="87.33333333333333" y="205.5" width="23.333333333333336" height="5.833333333333334" rx="1.05" fill="none" stroke="#718298" /><ellipse stroke-width="1.6666666666666667" cx="91.08333333333333" cy="208.41666666666666" rx="1.25" ry="1.25" fill="#718298" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="98.16666666666667" y="207.41666666666666" width="8.333333333333334" height="2.0" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2" x="115.0" y="310.0" width="470.0" height="215.0" rx="12" fill="#EAF2FC" stroke="#2864A5" /><rect stroke-width="2.3333333333333335" x="138.5" y="337.0" width="49.0" height="42.0" rx="7.56" fill="none" stroke="#2864A5" /><rect stroke-width="2.3333333333333335" x="138.5" y="344.93333333333334" width="49.0" height="2.8000000000000003" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(40.60129464500447 151.91666666666666 359.1666666666667)" x="146.53859906657914" y="357.4166666666667" width="10.756135200175036" height="3.5" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(139.39870535499554 151.91666666666666 366.1666666666667)" x="146.53859906657914" y="364.4166666666667" width="10.756135200175036" height="3.5" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2.3333333333333335" x="161.83333333333334" y="367.9166666666667" width="14.0" height="3.5" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2" x="775.0" y="310.0" width="450.0" height="215.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2.3333333333333335" transform="rotate(-40.0 814.25 358.0)" x="798.5" y="349.8333333333333" width="31.500000000000004" height="16.333333333333336" rx="2.9400000000000004" fill="none" stroke="#9D640D" /><rect stroke-width="2.3333333333333335" transform="rotate(-40.0 834.0833333333334 358.0)" x="818.3333333333334" y="349.8333333333333" width="31.500000000000004" height="16.333333333333336" rx="2.9400000000000004" fill="none" stroke="#9D640D" /><rect stroke-width="2" x="1415.0" y="310.0" width="470.0" height="215.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1442.0" y="334.6666666666667" width="42.0" height="46.66666666666667" rx="7.56" fill="none" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1446.6666666666667" y="340.5" width="32.66666666666667" height="8.166666666666668" rx="1.4700000000000002" fill="none" stroke="#718298" /><ellipse stroke-width="2.3333333333333335" cx="1451.9166666666667" cy="344.5833333333333" rx="1.75" ry="1.75" fill="#718298" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1461.8333333333333" y="343.18333333333334" width="11.666666666666668" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" x="1446.6666666666667" y="354.5" width="32.66666666666667" height="8.166666666666668" rx="1.4700000000000002" fill="none" stroke="#718298" /><ellipse stroke-width="2.3333333333333335" cx="1451.9166666666667" cy="358.5833333333333" rx="1.75" ry="1.75" fill="#718298" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1461.8333333333333" y="357.18333333333334" width="11.666666666666668" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" x="1446.6666666666667" y="368.5" width="32.66666666666667" height="8.166666666666668" rx="1.4700000000000002" fill="none" stroke="#718298" /><ellipse stroke-width="2.3333333333333335" cx="1451.9166666666667" cy="372.5833333333333" rx="1.75" ry="1.75" fill="#718298" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1461.8333333333333" y="371.18333333333334" width="11.666666666666668" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2" x="590.0" y="366.0" width="180.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="895.0" y="636.0" width="210.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="115.0" y="825.0" width="825.0" height="225.0" rx="12" fill="#ECF7EE" stroke="#32754B" /><ellipse stroke-width="2.3333333333333335" cx="163.0" cy="873.0" rx="24.5" ry="24.5" fill="none" stroke="#32754B" /><rect stroke-width="2.3333333333333335" transform="rotate(45.0 154.25 879.4166666666666)" x="146.82537879754125" y="877.6666666666666" width="14.849242404917499" height="3.5" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(-49.899092453787766 168.83333333333334 873.5833333333334)" x="154.34363392689676" y="871.8333333333334" width="28.979398812873185" height="3.5" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2" x="1055.0" y="825.0" width="830.0" height="225.0" rx="12" fill="#FCEDEF" stroke="#AD3E45" /><ellipse stroke-width="2.3333333333333335" cx="1103.0" cy="873.0" rx="24.5" ry="24.5" fill="none" stroke="#AD3E45" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 1103.0 868.3333333333334)" x="1093.6666666666667" y="866.0" width="18.666666666666668" height="4.666666666666667" rx="0" fill="#AD3E45" stroke="none" /><ellipse stroke-width="2.3333333333333335" cx="1103.0" cy="887.0" rx="2.3333333333333335" ry="2.3333333333333335" fill="#AD3E45" stroke="#AD3E45" /><rect stroke-width="2" x="100.0" y="1170.0" width="1800.0" height="105.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">基礎05  Dockerコマンドは、Engineへの依頼役</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">クライアント = 依頼する側。サーバー = 依頼を受けて処理する側。socket = 両者が通信する窓口。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">前提知識 5 / 06  |  基礎01–05：説明用の図  |  基礎06：実装基準 PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: Docker Docs: Docker architecture / Linux man-pages: unix(7) / spec §3, 11</text><text x="131.0" y="179.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">同じLinuxホスト内で通信する基本形</text><text x="131.0" y="208.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">この図では、dockerコマンドもEngineもホスト側に置いた一般例。管理コンテナへの接続は次の段階。</text><text x="209.0" y="339.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">① dockerコマンド</text><text x="137.0" y="422.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">クライアント（依頼役）。</text><text x="137.0" y="456.90000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">例：コンテナ一覧を求める。</text><text x="869.0" y="339.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">② Docker socket</text><text x="797.0" y="422.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/var/run/docker.sock</text><text x="797.0" y="456.90000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">EngineにつながるUnix通信口。</text><text x="1509.0" y="339.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">③ Docker Engine</text><text x="1437.0" y="422.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">サーバー（処理する側）。</text><text x="1437.0" y="456.90000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">一覧取得・作成・起動などを実施。</text><text x="680.0" y="372.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">要求を送る</text><text x="1000.0" y="642.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">結果を返す</text><text x="209.0" y="854.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">入口が見える + 使う権限がある</text><text x="137.0" y="942.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">接続してEngineへ要求を送れる。</text><text x="137.0" y="976.9" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">操作はEngine側が実行する。</text><text x="1149.0" y="854.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">入口がない / OS権限がない</text><text x="1077.0" y="942.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">dockerコマンドだけを入れても、</text><text x="1077.0" y="976.9" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">このsocket経由ではEngineを操作できない。</text><text x="112.0" y="1194.325" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">socketはファイル名を持つ「通信口」。設定を書き込む普通のファイルではない。</text><text x="112.0" y="1227.675" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">ここではUnix socketを説明している。別途公開されたネットワークAPIがあれば、それは別の接続経路になる。</text></svg>