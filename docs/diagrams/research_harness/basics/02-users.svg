<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img"><title>基礎02  OSは「誰の権限で動くか」を見る</title><desc>仕様と実装を照合した編集可能draw.io図のプレビュー。基準: PR108 / 仕様書PR115。</desc><rect x="0" y="0" width="2000" height="1400" fill="#FFFFFF" /><polyline points="570.0,392.5 745.0,392.5" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="745.0,392.5 733.0,387.5 733.0,397.5" fill="#2864A5" /><polyline points="1245.0,392.5 1420.0,392.5" fill="none" stroke="#AD3E45" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 6" /><polygon points="1420.0,392.5 1408.0,387.5 1408.0,397.5" fill="#AD3E45" /><rect stroke-width="2" x="100.0" y="280.0" width="470.0" height="225.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" x="123.5" y="307.0" width="49.0" height="42.0" rx="7.56" fill="none" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" x="123.5" y="314.93333333333334" width="49.0" height="2.8000000000000003" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(40.60129464500447 136.91666666666666 329.1666666666667)" x="131.53859906657914" y="327.4166666666667" width="10.756135200175036" height="3.5" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(139.39870535499554 136.91666666666666 336.1666666666667)" x="131.53859906657914" y="334.4166666666667" width="10.756135200175036" height="3.5" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" x="146.83333333333334" y="337.9166666666667" width="14.0" height="3.5" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2" x="745.0" y="280.0" width="500.0" height="225.0" rx="12" fill="#FFF4DC" stroke="#9D640D" /><rect stroke-width="2.3333333333333335" x="779.0" y="304.6666666666667" width="28.0" height="30.333333333333336" rx="5.04" fill="none" stroke="#9D640D" /><rect stroke-width="2.3333333333333335" x="772.0" y="324.5" width="42.0" height="26.833333333333336" rx="4.83" fill="#FFFFFF" stroke="#9D640D" /><ellipse stroke-width="2.3333333333333335" cx="793.0" cy="335.0" rx="3.5" ry="3.5" fill="#9D640D" stroke="#9D640D" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 793.0 340.8333333333333)" x="789.5" y="339.0833333333333" width="7.0" height="3.5" rx="0" fill="#9D640D" stroke="none" /><rect stroke-width="2" x="1420.0" y="280.0" width="480.0" height="225.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1449.3333333333333" y="303.5" width="37.333333333333336" height="49.0" rx="6.72" fill="none" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="1457.5" y="313.76666666666665" width="21.0" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" x="1457.5" y="323.1" width="21.0" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" x="1457.5" y="332.43333333333334" width="21.0" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2" x="575.0" y="336.0" width="170.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1250.0" y="336.0" width="170.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="100.0" y="625.0" width="1800.0" height="125.0" rx="12" fill="#FCEDEF" stroke="#AD3E45" /><rect stroke-width="2" x="100.0" y="875.0" width="850.0" height="270.0" rx="12" fill="#F0F4F8" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="129.33333333333334" y="898.5" width="37.333333333333336" height="49.0" rx="6.72" fill="none" stroke="#718298" /><rect stroke-width="2.3333333333333335" x="137.5" y="908.7666666666667" width="21.0" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" x="137.5" y="918.1" width="21.0" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" x="137.5" y="927.4333333333334" width="21.0" height="2.8000000000000003" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2" x="1050.0" y="875.0" width="850.0" height="270.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><ellipse stroke-width="2.3333333333333335" cx="1098.0" cy="923.0" rx="24.5" ry="24.5" fill="none" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" transform="rotate(45.0 1089.25 929.4166666666666)" x="1081.8253787975414" y="927.6666666666666" width="14.849242404917499" height="3.5" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(-49.899092453787766 1103.8333333333333 923.5833333333334)" x="1089.3436339268967" y="921.8333333333334" width="28.979398812873185" height="3.5" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2" x="100.0" y="1200.0" width="1800.0" height="65.0" rx="11.7" fill="#F0F4F8" stroke="#718298" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">基礎02  OSは「誰の権限で動くか」を見る</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">プロセスにはOSユーザーの番号（UID）が付く。ファイルには所有者とアクセス権が付く。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">前提知識 2 / 06  |  基礎01–05：説明用の図  |  基礎06：実装基準 PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: Linux man-pages: credentials(7), path_resolution(7) / spec §3, 12</text><text x="194.0" y="309.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">① 操作したいプロセス</text><text x="122.0" y="397.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">例：研究用Python</text><text x="122.0" y="431.90000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">実行ユーザー：UID10002</text><text x="839.0" y="309.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">② OSがアクセス権を照合</text><text x="767.0" y="397.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">プロセスのUID・groupと、</text><text x="767.0" y="431.90000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">ファイル等の所有者・権限を確認。</text><text x="1514.0" y="309.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">③ rootだけが読めるファイル</text><text x="1442.0" y="397.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">例：所有者UID0（root）</text><text x="1442.0" y="431.90000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">mode 0600：所有者だけが読み書き。</text><text x="660.0" y="342.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">読取要求</text><text x="1335.0" y="342.0" fill="#AD3E45" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">アクセス拒否</text><text x="112.0" y="655.65" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">この例のUID10002プロセスには、root専用ファイルを読む権限がない。</text><text x="112.0" y="693.35" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">プログラムが「読んでよい」と判断しても、OSのアクセス権はそれだけでは変わらない。</text><text x="194.0" y="904.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">PIDとUIDは、違う番号</text><text x="122.0" y="997.2" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">PID：どのプロセスかを区別する番号。</text><text x="122.0" y="1032.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">UID：どのOSユーザーの権限かを表す番号。</text><text x="122.0" y="1066.8" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じUIDで複数のプロセスを動かせる。</text><text x="1144.0" y="904.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">今回の分担につながる</text><text x="1072.0" y="997.2" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">監督プログラム：root（UID0）。</text><text x="1072.0" y="1032.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">研究するCodex：非root（UID10002）。</text><text x="1072.0" y="1066.8" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じ実験コンテナの中でも権限を分ける。</text><text x="112.0" y="1221.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">ファイル読取の例を単純化して示した。実際には親ディレクトリの権限、追加group、capability等も関係する。</text></svg>