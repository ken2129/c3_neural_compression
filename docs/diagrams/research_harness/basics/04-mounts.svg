3335" x="149.33333333333334" y="1067.0" width="14.0" height="7.0" rx="0" fill="none" stroke="#2864A5" /><rect stroke-width="2.3333333333333335" x="172.66666666666669" y="1067.0" width="14.0" height="7.0" rx="0" fill="none" stroke="#2864A5" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 152.83333333333334 1091.5)" x="142.33333333333334" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 163.33333333333334 1091.5)" x="152.83333333333334" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 173.83333333333334 1091.5)" x="163.33333333333334" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 184.33333333333334 1091.5)" x="173.83333333333334" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#2864A5" stroke="none" /><rect stroke-width="2" x="1140.0" y="1040.0" width="740.0" height="165.0" rx="12" fill="#E8F6F6" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" x="1163.5" y="1074.0" width="49.0" height="35.0" rx="6.3" fill="none" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" x="1169.3333333333333" y="1067.0" width="14.0" height="7.0" rx="0" fill="none" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" x="1192.6666666666667" y="1067.0" width="14.0" height="7.0" rx="0" fill="none" stroke="#087E8B" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 1172.8333333333333 1091.5)" x="1162.3333333333333" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 1183.3333333333333 1091.5)" x="1172.8333333333333" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 1193.8333333333333 1091.5)" x="1183.3333333333333" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#087E8B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 1204.3333333333333 1091.5)" x="1193.8333333333333" y="1090.1" width="21.0" height="2.8000000000000003" rx="0" fill="#087E8B" stroke="none" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">基礎04  mountは、外の保存先を中へ接続すること</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じ名前だから共有されるのではなく、どの保存先を接続するかで共有が決まる。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">前提知識 4 / 06  |  基礎01–05：説明用の図  |  基礎06：実装基準 PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: Docker Docs: Bind mounts / spec §7, 14, 17</text><text x="131.0" y="189.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">① 共有するmountを設定しない</text><text x="131.0" y="218.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">AとBは説明用。同じパスでも、別々の作業ファイルを参照する。</text><text x="214.0" y="329.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナAから見えるファイル</text><text x="142.0" y="404.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/data/result.txt</text><text x="142.0" y="439.40000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">内容：Aの結果</text><text x="1234.0" y="329.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナBから見えるファイル</text><text x="1162.0" y="404.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/data/result.txt</text><text x="1162.0" y="439.40000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">内容：Bの結果</text><text x="1000.0" y="385.5" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600" dominant-baseline="text-before-edge" text-anchor="middle">別の保存先</text><text x="131.0" y="679.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">② 同じホストフォルダを、両方にbind mountする</text><text x="131.0" y="708.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">矢印は保存先の接続を示す。ファイルのコピーや、別のディスクを作る操作ではない。</text><text x="744.0" y="819.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">ホスト上の実際の保存先</text><text x="672.0" y="892.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/srv/data（説明用のパス）</text><text x="214.0" y="1069.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナAでは /data</text><text x="142.0" y="1144.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/data/result.txt から同じ保存先を参照</text><text x="1234.0" y="1069.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナBでは /data</text><text x="1162.0" y="1144.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/data/result.txt から同じ保存先を参照</text></svg>