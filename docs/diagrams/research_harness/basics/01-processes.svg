<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img"><title>基礎01  プログラムを動かすと、何が生まれる？</title><desc>仕様と実装を照合した編集可能draw.io図のプレビュー。基準: PR108 / 仕様書PR115。</desc><rect x="0" y="0" width="2000" height="1400" fill="#FFFFFF" /><rect stroke-width="2" x="65.0" y="160.0" width="1870.0" height="1105.0" rx="12" fill="#F0F4F8" stroke="#718298" /><polyline points="640.0,385.0 820.0,385.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="820.0,385.0 808.0,380.0 808.0,390.0" fill="#2864A5" /><polyline points="1335.0,485.0 1335.0,570.0 985.0,570.0 985.0,655.0" fill="none" stroke="#2864A5" stroke-width="2.3" stroke-linejoin="round" /><polygon points="985.0,655.0 990.0,643.0 980.0,643.0" fill="#2864A5" /><polyline points="985.0,855.0 985.0,985.0" fill="none" stroke="#32754B" stroke-width="2.3" stroke-linejoin="round" /><polygon points="985.0,985.0 990.0,973.0 980.0,973.0" fill="#32754B" /><rect stroke-width="1.6666666666666667" x="84.0" y="176.33333333333334" width="30.0" height="33.333333333333336" rx="5.3999999999999995" fill="none" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="87.33333333333333" y="180.5" width="23.333333333333336" height="5.833333333333334" rx="1.05" fill="none" stroke="#718298" /><ellipse stroke-width="1.6666666666666667" cx="91.08333333333333" cy="183.41666666666666" rx="1.25" ry="1.25" fill="#718298" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="98.16666666666667" y="182.41666666666666" width="8.333333333333334" height="2.0" rx="0" fill="#718298" stroke="none" /><rect stroke-width="1.6666666666666667" x="87.33333333333333" y="190.5" width="23.333333333333336" height="5.833333333333334" rx="1.05" fill="none" stroke="#718298" /><ellipse stroke-width="1.6666666666666667" cx="91.08333333333333" cy="193.41666666666666" rx="1.25" ry="1.25" fill="#718298" stroke="#718298" /><rect stroke-width="1.6666666666666667" x="98.16666666666667" y="192.41666666