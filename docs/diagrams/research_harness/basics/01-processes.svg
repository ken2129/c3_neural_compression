"none" /><ellipse stroke-width="2.3333333333333335" cx="168.0" cy="703.0" rx="17.5" ry="17.5" fill="#FFFFFF" stroke="#2864A5" /><ellipse stroke-width="2.3333333333333335" cx="168.0" cy="703.0" rx="7.0" ry="7.0" fill="none" stroke="#2864A5" /><rect stroke-width="2" x="120.0" y="985.0" width="1730.0" height="190.0" rx="12" fill="#ECF7EE" stroke="#32754B" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 154.0 1010.25)" x="149.91666666666666" y="1008.85" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 154.0 1055.75)" x="149.91666666666666" y="1054.35" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="141.16666666666666" y="1017.6" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="186.66666666666669" y="1017.6" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 168.0 1010.25)" x="163.91666666666666" y="1008.85" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 168.0 1055.75)" x="163.91666666666666" y="1054.35" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="141.16666666666666" y="1031.6" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="186.66666666666669" y="1031.6" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 182.00000000000003 1010.25)" x="177.91666666666669" y="1008.85" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 182.00000000000003 1055.75)" x="177.91666666666669" y="1054.35" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="141.16666666666666" y="1045.6" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="186.66666666666669" y="1045.6" width="8.166666666666668" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="149.33333333333334" y="1014.3333333333334" width="37.333333333333336" height="37.333333333333336" rx="6.72" fill="#FFFFFF" stroke="#32754B" /><rect stroke-width="2.3333333333333335" x="157.5" y="1022.5" width="21.0" height="21.0" rx="0" fill="none" stroke="#32754B" /><rect stroke-width="2.3333333333333335" transform="rotate(90.0 168.0 1033.0)" x="157.5" y="1031.6" width="21.0" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2.3333333333333335" x="157.5" y="1031.6" width="21.0" height="2.8000000000000003" rx="0" fill="#32754B" stroke="none" /><rect stroke-width="2" x="670.0" y="336.0" width="120.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1050.0" y="556.0" width="200.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="880.0" y="906.0" width="210.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">基礎01  プログラムを動かすと、何が生まれる？</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">最初はDockerを考えず、1台のLinuxマシンでPythonを実行する場面から始める。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">前提知識 1 / 06  |  基礎01–05：説明用の図  |  基礎06：実装基準 PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: Linux man-pages: credentials(7) / Docker Docs: What is a container?</text><text x="131.0" y="174.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">ホスト = プログラムを動かすマシン</text><text x="131.0" y="203.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">この図ではまだコンテナを登場させない。上から、実行 → OS → ハードウェア。</text><text x="214.0" y="314.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">保存されているプログラム</text><text x="142.0" y="389.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">例：train.py</text><text x="142.0" y="424.40000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">ディスク上にある処理の記述。</text><text x="914.0" y="314.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">① 実行中のプログラム = プロセス</text><text x="842.0" y="389.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">python train.py を実行すると動き始める。</text><text x="842.0" y="424.40000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じプログラムでも、2回起動すれば別々の実行になる。</text><text x="214.0" y="684.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">② OSが実行とアクセスを支える</text><text x="142.0" y="759.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Linuxの中心部分（カーネル）が、CPUの実行時間・メモリ・ファイル・機器へのアクセスを管理する。</text><text x="142.0" y="794.4" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">プロセスはOSに依頼して、ファイルを読んだり、計算結果を書いたりする。</text><text x="214.0" y="1014.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">③ 実際の計算・保存を行うハードウェア</text><text x="142.0" y="1084.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">CPU / メモリ / ディスク / GPU</text><text x="142.0" y="1119.3999999999999" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">プロセス・OS・ハードウェアは、それぞれ別のもの。</text><text x="730.0" y="342.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">実行</text><text x="1150.0" y="562.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">OSへ依頼</text><text x="985.0" y="912.0" fill="#32754B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">資源を利用</text></svg>