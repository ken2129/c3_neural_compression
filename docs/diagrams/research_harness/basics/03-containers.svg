l="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(180.0 142.0 1053.0)" x="135.0" y="1048.9166666666667" width="14.0" height="8.166666666666668" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(225.0 148.1507575950825 1038.1507575950825)" x="141.1507575950825" y="1034.0674242617492" width="14.0" height="8.166666666666668" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(270.0 163.0 1032.0)" x="156.0" y="1027.9166666666667" width="14.0" height="8.166666666666668" rx="0" fill="#718298" stroke="none" /><rect stroke-width="2.3333333333333335" transform="rotate(315.0 177.8492424049175 1038.1507575950825)" x="170.8492424049175" y="1034.0674242617492" width="14.0" height="8.166666666666668" rx="0" fill="#718298" stroke="none" /><ellipse stroke-width="2.3333333333333335" cx="163.0" cy="1053.0" rx="17.5" ry="17.5" fill="#FFFFFF" stroke="#718298" /><ellipse stroke-width="2.3333333333333335" cx="163.0" cy="1053.0" rx="7.0" ry="7.0" fill="none" stroke="#718298" /><rect stroke-width="2" x="290.0" y="241.0" width="120.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><rect stroke-width="2" x="1590.0" y="241.0" width="120.0" height="28.0" rx="0" fill="#FFFFFF" stroke="none" /><text x="48.0" y="36.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">基礎03  コンテナは、見える範囲を分ける</text><text x="50.0" y="100.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">イメージはもとになるファイル一式。コンテナは、そこから作る分離された実行環境。</text><text x="50.0" y="1329.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">前提知識 3 / 06  |  基礎01–05：説明用の図  |  基礎06：実装基準 PR108 @ 21af4c2d</text><text x="50.0" y="1358.0" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="14" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">根拠: Docker Docs: What is a container? / What is Docker? / spec §2, 14</text><text x="734.0" y="189.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">イメージ = もとになるファイル一式</text><text x="662.0" y="259.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Python・ライブラリ・初期ファイル等。</text><text x="662.0" y="294.40000000000003" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じイメージから、複数のコンテナを作成できる。</text><text x="131.0" y="424.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">同じLinuxホスト</text><text x="131.0" y="453.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">以下は一般的な説明用のA・B。現在の管理・実験コンテナを示すものではない。</text><text x="181.0" y="524.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナA</text><text x="181.0" y="553.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">A用のファイルの見え方・プロセスの見え方</text><text x="1141.0" y="524.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">コンテナB</text><text x="1141.0" y="553.5" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">B用のファイルの見え方・プロセスの見え方</text><text x="244.0" y="664.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">Aのプロセス</text><text x="172.0" y="738.275" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Python等を実行。</text><text x="172.0" y="768.725" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Aの環境からファイルを見る。</text><text x="629.0" y="664.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">Aのファイル</text><text x="557.0" y="734.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/work/result.txt</text><text x="557.0" y="769.4" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">内容：Aの結果</text><text x="1204.0" y="664.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">Bのプロセス</text><text x="1132.0" y="738.275" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Python等を実行。</text><text x="1132.0" y="768.725" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Bの環境からファイルを見る。</text><text x="1589.0" y="664.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">Bのファイル</text><text x="1517.0" y="734.6" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">/work/result.txt</text><text x="1517.0" y="769.4" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">内容：Bの結果</text><text x="209.0" y="1034.0" fill="#183047" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" dominant-baseline="text-before-edge" text-anchor="start">ホストのLinuxカーネルを共有</text><text x="137.0" y="1107.1" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">別の物理マシンや、カーネルを持つ別OSを2台用意する構成ではない。</text><text x="137.0" y="1141.8999999999999" fill="#53677A" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">同じパス名でも、共有を設定しなければAとBの作業ファイルは別。</text><text x="350.0" y="247.0" fill="#2864A5" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">作成</text><text x="1650.0" y="247.0" fill="#087E8B" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge" text-anchor="middle">作成</text></svg>