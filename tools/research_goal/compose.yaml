# NEW goal-only deployment. No canary volume, host socket, bind or GPU access.
# Explicit approval is needed for new image/volume, arbitrary CPU commands,
# worker-readable model authentication, and unrestricted outbound bridge access.
services:
  controller:
    build:
      context: ${C3_GOAL_CONTEXT:?prepared immutable context required}
      dockerfile: tools/research_goal/Dockerfile
      args:
        SOURCE_SHA: ${C3_RUNTIME_SHA:?reviewed runtime revision required}
        INPUT_SOURCE_SHA: ${C3_INPUT_SHA:?approved input revision required}
    labels:
      c3.purpose: dedicated-goal-controller
      c3.source-sha: ${C3_RUNTIME_SHA}
      c3.input-source-sha: ${C3_INPUT_SHA}
    user: "0:0"
    init: false
    read_only: true
    network_mode: bridge
    ipc: private
    cgroup: private
    runtime: runc
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${C3_GOAL_PIDS:?operator profile required}
    mem_limit: ${C3_GOAL_MEMORY:?operator profile required}
    memswap_limit: ${C3_GOAL_MEMORY}
    cpus: 1
    shm_size: 64m
    restart: unless-stopped
    volumes:
      - goal-control:/control
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=${C3_GOAL_WORK:?operator profile required},mode=0755,uid=0,gid=0
volumes:
  goal-control:
